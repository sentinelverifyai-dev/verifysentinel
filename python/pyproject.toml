[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verifysentinel"
version = "0.1.0"
description = "Is this picture made by AI? A small client for Sentinel's AI image check."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Small Room", email = "sentinelverifyai@gmail.com" }]
keywords = ["ai-image-detection", "deepfake", "image-forensics", "ai-generated-images"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://verifysentinel.com"
Source = "https://github.com/sentinelverifyai-dev/verifysentinel"

[tool.setuptools]
packages = ["verifysentinel"]
